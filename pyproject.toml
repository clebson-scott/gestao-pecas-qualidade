[project]
name = "gestao-pecas-qualidade"
version = "1.0.0"
description = "Sistema de Gestão de Peças, Qualidade e Armazenamento — desafio de automação digital"
authors = [{ name = "Clebson Scott" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "mypy>=1.7", "ruff>=0.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erros de estilo)
    "W",   # pycodestyle (warnings)
    "F",   # pyflakes (erros reais: variável não usada, import não usado)
    "I",   # isort (ordem e agrupamento de imports)
    "B",   # bugbear (padrões propensos a bug)
    "UP",  # pyupgrade (sintaxe moderna de Python)
    "SIM", # simplificação de código
]
ignore = ["E501"]  # linhas longas em docstrings didáticas são aceitas

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pecas_qualidade"]
omit = ["pecas_qualidade/__init__.py"]

[tool.coverage.report]
show_missing = true
precision = 2
